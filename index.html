<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>George Smerdov</title>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
        }

       
        .main-letter {
            font-size: 130px;
            font-weight: 800;
            color: #111111;
            text-transform: uppercase;
            line-height: 1;
            user-select: none;
        }

       
        .extra-text {
            font-size: 100px;
            font-weight: 600;
            color: #444444;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            opacity: 0;
            max-width: 0;
        }

        
        .text-g {
            padding-left: 8px;
            animation: expandTextG 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        .text-s {
            padding-left: 8px;
            animation: expandTextS 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        
        .divider {
            width: 2px;
            background-color: #cccccc;
            border-radius: 1px;
            height: 0;
            opacity: 0;
            margin: 0;
            animation: showDivider 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }


        @keyframes showDivider {
            0%, 15%, 85%, 100% {
                height: 0;
                opacity: 0;
                margin: 0;
            }
            28%, 72% {
                height: 85px;
                opacity: 1;
                margin: 0 30px; 
            }
        }

        
        @keyframes expandTextG {
            0%, 15%, 85%, 100% {
                opacity: 0;
                max-width: 0;
                letter-spacing: -10px;
            }
            20% {
                opacity: 1; 
            }
            28%, 72% {
                opacity: 1;
                max-width: 350px; 
                letter-spacing: normal;
            }
        }

       
        @keyframes expandTextS {
            0%, 15%, 85%, 100% {
                opacity: 0;
                max-width: 0;
                letter-spacing: -10px;
            }
            20% {
                opacity: 1;
            }
            28%, 72% {
                opacity: 1;
                max-width: 450px;
                letter-spacing: normal;
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
       
        <div class="main-letter">G</div>
        <div class="extra-text text-g">eorge</div>
        
        
        <div class="divider"></div>
        
        
        <div class="main-letter">S</div>
        <div class="extra-text text-s">merdov</div>
    </div>

</body>
</html>
